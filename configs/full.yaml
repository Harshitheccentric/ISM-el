# Full run: the whole public range. Never shrink it to fit Drive (see CLAUDE.md).
mode: full
data_source: backblaze        # backblaze | synthetic (synthetic is for tests only)

# Paths are not hashed. The notebook sets these on Colab.
root: data/root               # durable tier: audit, Parquet, splits, models, results
local_dir: data/local         # cache tier + scratch (/content/... on Colab)

start_quarter: 2016Q1
end_quarter: 2026Q2
# Exact model strings; non-empty skips the audit (pass 1) and select. Pass 2 keeps these
# (Harsh, 2026-10-28): the audit's 3 selected models, 2 more steady pod_ok models, and
# MG08ACA16TEY as a second vendor. Which models enter each study is set later in config.
# ST16000NM001G is left out: its pod_key coverage is 0.82-0.91 from 2023Q4 to 2024Q4.
models:
  - ST4000DM000
  - ST12000NM0008
  - ST8000NM0055
  - ST8000DM002
  - ST14000NM001G
  - TOSHIBA MG08ACA16TEY

horizons: [7, 14, 30]         # days
seed: 42

# SMART attributes kept (raw values only). S: 5 9 187 188 194 197 198; W/N: 241 242.
smart_ids: [5, 9, 187, 188, 194, 197, 198, 241, 242]

# Model selection by the audit (HANDOFF rule). Ranked by (pod_ok, failures).
selection:
  min_failures: 100           # failures inside the model's S/W/N window
  min_coverage: 0.95          # non-null share of 241/242 (S/W/N) and of pod fields (P)
  max_models: 3
  boot_share: 0.95            # boot model: this share of rows with empty slot or no SMART

budget:
  margin_bytes: 1000000000    # keep this much free on each disk
  # Estimate per size = max(default, 1.5 x largest measured quarter). Errs high.
  # Defaults = 1.5 x measured on 2026Q1, the newest and largest quarter (2026-10-27):
  # zip 1.31 GB, largest day CSV 136 MB, Parquet 497 MB with all 49 non-boot models
  # (44 MB with the one selected model).
  default_zip_bytes: 2000000000
  default_day_bytes: 210000000
  default_parquet_bytes: 750000000

# M3 splits. Drives that fail inside a study's split window go to that split; all other
# drives go by a seeded hash with these shares. Train healthy drives are downsampled by
# drive (healthy_per_failed per failed train drive). Warn if a test cell has fewer
# failed drives than min_test_failures.
splits:
  shares: {train: 0.5, val: 0.2, test: 0.3}
  healthy_per_failed: 20
  # A model enters a study only with at least this many failed drives in each split;
  # otherwise it is left out of the study (splits/summary.csv says why).
  min_failed_drives: {train: 30, val: 1, test: 1}
  min_test_failures: 50

studies:
  # Study W (workload): S/W/N features. Per model [first, last quarter] of its S/W/N
  # window (audit/summary.csv). The window ends at its last quarter with >=
  # min_quarter_failures failures (splits/windows.csv). Last test_quarters = test, the
  # val_quarters before = val, the rest = train.
  W:
    groups: [S, W, N]
    val_quarters: 2
    test_quarters: 2
    min_quarter_failures: 10
    models:
      ST4000DM000: [2016Q1, 2025Q1]
      ST12000NM0008: [2019Q4, 2026Q2]
      ST8000NM0055: [2016Q4, 2026Q2]
      ST8000DM002: [2016Q2, 2026Q2]
      ST14000NM001G: [2020Q3, 2026Q2]
      TOSHIBA MG08ACA16TEY: [2020Q4, 2026Q2]
  # Study P (pod): all groups, only models with failures in the test window. Pod fields
  # start 2023-07-01; train starts a month later so 30-day pod features are complete.
  P:
    groups: [S, W, N, P]
    start: 2023-07-01
    train: [2023-08-01, 2025-03-31]
    val: [2025-04-01, 2025-09-30]
    test: [2025-10-01, 2026-06-30]
