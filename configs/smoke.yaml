# Smoke run: one quarter end to end, to prove the pipeline on Colab before the full run.
mode: smoke
data_source: backblaze        # backblaze | synthetic (synthetic is for tests only)

# Paths are not hashed. The notebook sets these on Colab.
root: data/root               # durable tier: audit, Parquet, splits, models, results
local_dir: data/local         # cache tier + scratch (/content/... on Colab)

start_quarter: 2026Q1
end_quarter: 2026Q1
models: []                    # exact model strings; non-empty skips the audit (pass 1)

horizons: [7, 14, 30]         # days
seed: 42

# SMART attributes kept (raw values only). S: 5 9 187 188 194 197 198; W/N: 241 242.
smart_ids: [5, 9, 187, 188, 194, 197, 198, 241, 242]

# Model selection by the audit (HANDOFF rule). Ranked by (pod_ok, failures).
selection:
  min_failures: 100           # failures inside the model's S/W/N window
  min_coverage: 0.95          # non-null share of 241/242 (S/W/N) and of pod fields (P)
  max_models: 3
  boot_share: 0.95            # boot model: this share of rows with empty slot or no SMART

dropped_days: {}              # day files left out as a whole (see full.yaml)
smart_missing_days: {}        # days whose SMART values are not readings (see full.yaml)

budget:
  margin_bytes: 1000000000    # keep this much free on each disk
  # Estimate per size = max(default, 1.5 x largest measured quarter). Errs high.
  # Defaults = 1.5 x measured on 2026Q1, the newest and largest quarter (2026-10-27):
  # zip 1.31 GB, largest day CSV 136 MB, Parquet 497 MB with all 49 non-boot models
  # (44 MB with the one selected model).
  default_zip_bytes: 2000000000
  default_day_bytes: 210000000
  default_parquet_bytes: 750000000
  default_feature_bytes_per_row: 60   # feature files; replaced by 1.5 x the measured value

# M3 splits (see full.yaml). The smoke run has one quarter: no Study W (it needs
# val + test + train quarters); Study P with short windows inside 2026Q1, only to prove
# the pipeline runs end to end. Never a result.
splits:
  shares: {train: 0.5, val: 0.2, test: 0.3}
  healthy_per_failed: 20
  # A model enters a study only with at least this many failed drives in each split;
  # otherwise it is left out of the study (splits/summary.csv says why).
  min_failed_drives: {train: 30, val: 1, test: 1}
  min_test_failures: 50         # warn below this many failed drives in a test cell

studies:
  P:
    groups: [S, W, N, P]
    start: 2026-01-01
    train: [2026-01-08, 2026-02-10]
    val: [2026-02-11, 2026-03-01]
    test: [2026-03-02, 2026-03-31]

# M4 features (see src/diskctx/features.py). Every feature at day t uses only rows <= t-1,
# computed as of the drive's last reading of each column and carried forward.
features:
  s_smart_ids: [5, 9, 187, 188, 194, 197, 198]   # S raw values, if the model reports them
  error_counters: [5, 187, 188, 197, 198]        # S deltas and N use these
  min_coverage: 0.95          # a SMART ID enters a model's S set at this non-null share (train + val)
  windows: [7, 30]            # days, for deltas, means, maxima and N
  lba_bytes: 512              # SMART 241/242 count 512-byte LBAs
  fill_phase_max_fills: 1.0   # fill phase while lifetime writes < this x capacity
  n_floor_tb_per_day: 0.01    # floor for every workload denominator (N, recent / lifetime)
  pod_window_days: 30         # P failure counts over the days [t-30, t-1]
  excess_smoothing: 1         # P excess = (observed + 1) / (expected + 1)
  # Train split only (storage, not evaluation; Harsh, 2026-10-28): keep every row within
  # near_failure_days of a failure, hash-sample the rest so a study stores <= max_rows.
  train_sample: {max_rows: 15000000, near_failure_days: 60}

# How much memory DuckDB may use. Not hashed: it never changes a result. 3 GB fits this
# 7 GB laptop and free Colab (12 GB).
resources:
  duckdb_memory_limit: 3GB
  duckdb_threads: 4
