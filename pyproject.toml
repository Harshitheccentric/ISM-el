[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diskctx"
version = "0.0.1"
description = "Context-aware disk failure prediction on Backblaze Drive Stats"
requires-python = ">=3.11"
# Pinned: the notebook installs these itself, with the same pins.
# Ranges: Colab preinstalls these; forcing exact versions can break its environment.
dependencies = [
    "duckdb==1.5.6",
    "polars==1.44.2",
    "pyyaml==6.0.3",
    "numpy>=1.26",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "scipy>=1.11",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
